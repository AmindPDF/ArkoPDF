# project.yml — XcodeGen 配置（可选）
# 用法：brew install xcodegen && xcodegen generate
# 前置：SDK 头文件在 SDK/include/，两个静态库在 SDK/lib/（自包含，无需外部依赖）。

name: ArkoPDF
options:
  bundleIdPrefix: com.arkopdf
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  # CI runner 是 Xcode 15，显式指定避免生成 objectVersion 77(Xcode 16) 打不开
  projectFormat: "xcode15_0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_EXCEPTIONS: YES
    ENABLE_BITCODE: NO
    GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: YES

targets:
  ArkoPDF:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: ViewModel
      - path: Views
      - path: Modules
      - path: Bridge
      - path: ArkoPDF-Bridging-Header.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arkopdf.ArkoPDF
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_OBJC_BRIDGING_HEADER: ArkoPDF-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)
          - $(SRCROOT)/SDK/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/SDK/lib
        OTHER_LDFLAGS:
          # 顺序很重要：PDSDK 依赖 PDFium，PDFium 必须排在 PDSDK 之后
          - $(SRCROOT)/SDK/lib/libPDSDK.a
          - $(SRCROOT)/SDK/lib/libPDFium.a
    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Carbon.framework
      - sdk: Security.framework

  # ============ 无头冒烟测试工具（CI 验证渲染/标注/保存）============
  smoke:
    type: tool
    platform: macOS
    sources:
      - path: Bridge
      - path: smoke
    settings:
      base:
        PRODUCT_NAME: smoke
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)
          - $(SRCROOT)/Bridge
          - $(SRCROOT)/SDK/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/SDK/lib
        OTHER_LDFLAGS:
          - $(SRCROOT)/SDK/lib/libPDSDK.a
          - $(SRCROOT)/SDK/lib/libPDFium.a
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        ENABLE_BITCODE: NO
    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Carbon.framework
      - sdk: Security.framework

# —— 显式 scheme，命令行 xcodebuild 可直接用 ——
schemes:
  ArkoPDF:
    build:
      targets:
        ArkoPDF: all
    run:
      config: Release
  smoke:
    build:
      targets:
        smoke: all
    run:
      config: Release
